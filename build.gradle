// A circuit breaker for one outside system: open after failures in a row, then one probe at a time.
// Plain Java besides the error library: no beans, no properties, so any service can use it.
plugins {
    alias(libs.plugins.platform.library)
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.error4j // a breaker built with bad settings is a GeneralException
    runtimeOnly libs.config4j // loads properties/breaker-exception.yaml

    compileOnly libs.micrometer.core

    testImplementation testFixtures(libs.error4j) // ErrorDefinitions
    testImplementation libs.micrometer.core
}
