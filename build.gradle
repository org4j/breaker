// A circuit breaker for one outside system: open after failures in a row, then one probe at a time.
// Plain Java besides the error library: no beans, no properties, so any service can use it.
plugins {
    alias(libs.plugins.conventions.library)
}

dependencies {
    api platform(libs.spring.boot.bom)
    api libs.error // a refused call and a bad setting are GeneralExceptions
    implementation libs.spring.web // the default predicate reads RestClient's exceptions
    runtimeOnly libs.config // loads properties/breaker-exception.yaml

    compileOnly libs.micrometer.core // BreakerMeterBinder, for a service that has Micrometer

    testImplementation testFixtures(libs.error) // ErrorDefinitions
    testImplementation libs.micrometer.core
}
